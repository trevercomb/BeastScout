# Pushing a version tag (e.g. v0.10.0) builds the addon zip with the BigWigs
# packager and publishes it: a GitHub release always, and CurseForge once the
# CF_API_KEY secret is set and the .toc has an X-Curse-Project-ID line.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out (full history, for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the offline tests first
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          lua5.4 tests/run.lua
          python3 tests/test_build.py
          python3 tests/test_sync.py
          python3 tests/test_pull.py

      - name: Package and upload
        uses: BigWigsMods/packager@v2
